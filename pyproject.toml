[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "guard-rail-edge"
version = "0.1.0"
description = "Automated prompt injection & jailbreak testing against LLM system prompts using local edge models for CI/CD pipelines"
readme = "README.md"
authors = [{ name = "Zayan Ahmed" }]
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["llm", "security", "jailbreak", "prompt-injection", "ci-cd", "ollama", "evaluator", "guardrails"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "ollama>=0.3.0",
    "pydantic>=2.6.0",
]

[project.urls]
Homepage = "https://github.com/zayanahmed23/guard-rail-edge"
Repository = "https://github.com/zayanahmed23/guard-rail-edge.git"
Issues = "https://github.com/zayanahmed23/guard-rail-edge/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
]

[project.scripts]
guard-rail-edge = "guard_rail_edge.main:app"

[tool.setuptools]
py-modules = ["main", "schemas", "evaluator", "patcher"]

[tool.setuptools.packages.find]
where = ["."]
include = ["guard_rail_edge*"]
