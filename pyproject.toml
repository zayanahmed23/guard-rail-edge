[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "guard-rail-edge"
dynamic = ["version"]
description = "Automated prompt injection & jailbreak testing against LLM system prompts using local edge models for CI/CD pipelines"
readme = "README.md"
authors = [{ name = "Zayan Ahmed" }]
license = "MIT"
requires-python = ">=3.11"
keywords = ["llm", "security", "jailbreak", "prompt-injection", "ci-cd", "ollama", "evaluator", "guardrails"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "ollama>=0.5.0",
    "pydantic>=2.6.0",
]

[project.urls]
Homepage = "https://github.com/zayanahmed23/guard-rail-edge"
Repository = "https://github.com/zayanahmed23/guard-rail-edge.git"
Issues = "https://github.com/zayanahmed23/guard-rail-edge/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "build>=1.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
guard-rail-edge = "guard_rail_edge.main:app"

[tool.setuptools.dynamic]
version = {attr = "guard_rail_edge.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["guard_rail_edge*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]


