name: CI & Guardrail Security Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint, Type Check & Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with Ruff
        run: |
          ruff check .

      - name: Type Check with Mypy
        run: |
          mypy guard_rail_edge

      - name: Run Pytest Suite with Coverage
        run: |
          pytest --cov=guard_rail_edge --cov-fail-under=85

      - name: Live CLI Demo - Subfolder Scaffold, Auto-Patch & Git Apply Smoke Test
        run: |
          guard-rail-edge init -o prompts/demo.json --force
          git add prompts/demo.json
          guard-rail-edge run -s prompts/demo.json --mock --auto-patch \
            --report-json ci_report.json || test $? -eq 1
          git apply --check prompts/demo.patch

      - name: Verify Generated Patch & Report Artifacts
        run: |
          test -f prompts/demo.patch
          test -f ci_report.json
          echo "Verified prompts/demo.patch and ci_report.json exist."

      - name: Upload Security Report & Proposed Patch
        uses: actions/upload-artifact@v4
        with:
          name: security-artifacts-python-${{ matrix.python-version }}
          path: |
            prompts/demo.patch
            ci_report.json
