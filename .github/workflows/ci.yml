name: CI & Guardrail Security Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Pytest & Coverage (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Pytest Suite
        run: |
          python -m pytest -v


      - name: Live CLI Demo - Scaffold Starter Suite
        run: |
          python main.py init --output demo_tests.json --force

      - name: Live CLI Demo - Run Evaluation with Auto-Patch and CI Report
        run: |
          # The mock demo intentionally encounters jailbreaks, generates a patch, and returns exit code 1 to block CI
          python main.py run --suite demo_tests.json --mock --auto-patch --report-json ci_report.json || true

      - name: Verify Generated Patch & Report Artifacts
        run: |
          test -f demo_tests.patch
          test -f ci_report.json
          echo "Verified demo_tests.patch and ci_report.json exist."

      - name: Upload Security Report & Proposed Patch
        uses: actions/upload-artifact@v4
        with:
          name: security-artifacts-python-${{ matrix.python-version }}
          path: |
            demo_tests.patch
            ci_report.json
