name: TestPyPI Dry-Run Release

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Package Distribution & Check Metadata
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Build & Validation Tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build Source Distribution & Binary Wheel
        run: |
          python -m build

      - name: Validate Package Metadata with Twine
        run: |
          twine check dist/*

      - name: Upload Distribution Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions-testpypi
          path: dist/

  publish-testpypi:
    name: Publish to TestPyPI (Trusted Publishing)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/guard-rail-edge
    permissions:
      id-token: write

    steps:
      - name: Download Distribution Artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions-testpypi
          path: dist/

      - name: Publish Package to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          repository-url: https://test.pypi.org/legacy/
