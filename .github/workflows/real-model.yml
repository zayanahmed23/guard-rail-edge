name: Real Model Smoke Test

on:
  workflow_dispatch:
    inputs:
      target_model:
        description: "Target model to evaluate"
        required: true
        default: "qwen2.5:0.5b"
      judge_model:
        description: "Judge model for evaluation"
        required: true
        default: "qwen2.5:1.5b"

jobs:
  smoke:
    name: Ollama Real Model Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama Service & Wait for Readiness
        run: |
          ollama serve &
          echo "Waiting for Ollama to become ready..."
          for i in {1..60}; do
            if curl -sf http://localhost:11434/api/version > /dev/null; then
              echo "Ollama is reachable!"
              curl -s http://localhost:11434/api/version
              echo ""
              break
            fi
            sleep 1
          done

      - name: Pull Target and Judge Models
        run: |
          ollama pull ${{ inputs.target_model }}
          ollama pull ${{ inputs.judge_model }}

      - name: Install Package
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Run Real Model Smoke Evaluation
        run: |
          python scripts/real_model_smoke.py \
            --target-model "${{ inputs.target_model }}" \
            --judge-model "${{ inputs.judge_model }}" \
            --out real-model-results.md \
            --report-dir smoke-reports

      - name: Upload Smoke Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-model-smoke-results
          path: |
            real-model-results.md
            smoke-reports/*.json
