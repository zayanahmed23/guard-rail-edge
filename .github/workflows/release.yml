name: Release & Publish to PyPI

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    name: Build Package Distribution & Check Metadata
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Build & Validation Tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Verify Git Tag Matches Package Version
        run: |
          python -c "
          import guard_rail_edge
          tag = '${{ github.ref_name }}'.lstrip('v')
          pkg_ver = guard_rail_edge.__version__
          assert pkg_ver == tag, f'Package version ({pkg_ver}) does not match tag ({tag})'
          print(f'[OK] Tag v{tag} matches package version {pkg_ver}')
          "

      - name: Build Source Distribution & Binary Wheel
        run: |
          python -m build

      - name: Validate Package Metadata with Twine
        run: |
          twine check dist/*

      - name: Upload Distribution Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish-pypi:
    name: Publish to PyPI (Trusted Publishing)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/guard-rail-edge
    permissions:
      id-token: write

    steps:
      - name: Download Distribution Artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish Package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  github-release:
    name: Create GitHub Release
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download Distribution Artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Extract Release Notes from CHANGELOG.md
        run: |
          python scripts/extract_changelog.py "${{ github.ref_name }}" > release_notes.md
          cat release_notes.md

      - name: Create GitHub Release with Artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --title "guard-rail-edge ${{ github.ref_name }}" \
            --notes-file release_notes.md
